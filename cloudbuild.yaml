steps:
  # 1. Воспроизводимая установка по lockfile
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']

  # 2. Characterization gate
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['test']

  # 3. Сборка с безопасной commit/build/publication identity
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - VITE_API_URL=${_VITE_API_URL}
      - VITE_DADATA_API_KEY=${_VITE_DADATA_API_KEY}
      - VITE_YANDEX_MAPS_API_KEY=${_VITE_YANDEX_MAPS_API_KEY}
      - VITE_RELEASE_COMMIT_SHA=$COMMIT_SHA
      - VITE_RELEASE_BUILD_ID=$BUILD_ID
      - VITE_RELEASE_PUBLICATION_ID=$BUILD_ID

  # 4. Проверить manifest и asset hashes до публикации
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'verify:release']

  # 5. Сохранить immutable application-level rollback snapshot в том же bucket
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      [
        'gsutil',
        '-m',
        'rsync',
        '-r',
        '-d',
        'dist',
        'gs://frontend-parts-site/releases/$BUILD_ID'
      ]

  # 6. Синхронизировать текущий root, не удаляя release snapshots
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      [
        'gsutil',
        '-m',
        'rsync',
        '-r',
        '-d',
        '-x',
        '^releases/.*',
        'dist',
        'gs://frontend-parts-site'
      ]

  # 7. entrypoint и release identity не должны кэшироваться
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      [
        'gsutil',
        'setmeta',
        '-h',
        'Cache-Control:no-cache, no-store, must-revalidate',
        'gs://frontend-parts-site/index.html',
        'gs://frontend-parts-site/release.json'
      ]

options:
  logging: CLOUD_LOGGING_ONLY

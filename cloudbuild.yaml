steps:
  # 1. Установить зависимости
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']

  # 2. Собрать фронтенд с переменными окружения из триггера
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - VITE_API_URL=${_VITE_API_URL}
      - VITE_DADATA_API_KEY=${_VITE_DADATA_API_KEY}
      - VITE_YANDEX_MAPS_API_KEY=${_VITE_YANDEX_MAPS_API_KEY}


  # 3. Синхронизировать dist/ с Bucket (с удалением устаревших файлов)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      [
        'gsutil',
        '-m',
        'rsync',
        '-r',
        '-d',
        'dist',
        'gs://frontend-parts-site'
      ]

  # 4. index.html не должен кэшироваться, иначе браузер держит старый entrypoint
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      [
        'gsutil',
        'setmeta',
        '-h',
        'Cache-Control:no-cache, no-store, must-revalidate',
        'gs://frontend-parts-site/index.html'
      ]

  # 5. versioned assets можно кэшировать агрессивно
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      [
        'gsutil',
        'setmeta',
        '-h',
        'Cache-Control:public, max-age=31536000, immutable',
        'gs://frontend-parts-site/assets/**'
      ]

options:
  logging: CLOUD_LOGGING_ONLY
